# Refresh the pricing data for the Model Pricing & Value static page.
#
# The page itself is pure static (GitHub Pages / any static host), and
# browsers cannot fetch opencode.ai/docs/go directly (no CORS headers).
# This workflow regenerates data/models.json from the upstream page on a
# schedule (and on demand), commits it, and pushes — the Pages deploy then
# picks up the fresh data automatically.
#
# Place this file at .github/workflows/refresh-pricing.yml in the repo.
name: Refresh pricing data

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {} # manual run button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate data/models.json
        run: node tools/update-snapshot.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json
          if git diff --cached --quiet; then
            echo "data/models.json unchanged — nothing to commit"
          else
            git commit -m "chore: refresh pricing data"
            git push
          fi